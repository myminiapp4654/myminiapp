<!DOCTYPE html>
<html lang="uz">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Oyinim — do'stlar bilan onlayn o'yinlar">
  <meta name="theme-color" content="#0D0D0D">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Oyinim">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Oyinim</title>
  <link rel="manifest" href="manifest.json">

  <!-- Telegram Mini App API (window.Telegram.WebApp) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0D0D0D;
      overflow: hidden;
    }
    #loader {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      font-family: monospace;
      color: #00FF88;
      transition: opacity .35s ease;
    }
    #loader .title { font-size: 26px; font-weight: bold; letter-spacing: 3px; }
    #loader .bar {
      width: 160px; height: 8px;
      border: 2px solid #00FF88;
      overflow: hidden;
    }
    #loader .bar::after {
      content: ""; display: block; height: 100%; width: 40%;
      background: #00FF88;
      animation: slide 1s steps(6) infinite;
    }
    #loader .hint { font-size: 12px; color: #8888AA; }
    @keyframes slide { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  </style>
</head>
<body>
  <!-- Flutter yuklanguncha ko'rinadigan ekran -->
  <div id="loader">
    <div class="title">[ OYINIM ]</div>
    <div class="bar"></div>
    <div class="hint">Yuklanmoqda...</div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loader');
      if (!l) return;
      l.style.opacity = '0';
      setTimeout(function () { l.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
