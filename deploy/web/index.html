<!DOCTYPE html>
<html lang="uz">
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="Break Time — do'stlar bilan onlayn o'yinlar">
  <meta name="theme-color" content="#1B1446">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Break Time">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Break Time</title>
  <link rel="manifest" href="manifest.json">

  <!-- Telegram Mini App API (window.Telegram.WebApp) -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    html, body { margin: 0; height: 100%; background: #0A0A1F; }
    #loader { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #loader div { width: 32px; height: 32px; border: 3px solid #555; border-top-color: #8C7BFF; border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Flutter yuklanguncha ko'rinadigan ekran -->
  <div id="loader"><div></div></div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var l = document.getElementById('loader');
      if (!l) return;
      l.style.opacity = '0';
      setTimeout(function () { l.remove(); }, 400);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
